                        model:
                          type: string
                          enum:
                            - dialogue
                          description: |-
                            텍스트 요약을 위해 사용할 모델을 이름입니다.

                            명시하지 않을 경우 dialogue가 사용됩니다.

                            사용 가능한 모델은 다음과 같습니다.

                            |모델|설명|
                            |:---:|:---:|
                            |dialogue|대화를 요약하는 모델입니다.|
                        outputSizeOption:
                          type: string
                          enum:
                            - small
                            - medium
                            - large
                          description: |-
                            요약 결과의 분량을 결정하는 설정입니다.

                            `small`, `medium`, `large` 중 하나를 사용 할 수 있습니다.

                            `maxCharsPerParagraph` 값이 주어질 경우 `outputSizeOption`은 무시됩니다.
                        maxCharsPerParagraph:
                          type: integer
                          description: |-
                            한 문단을 구성 할 수 있는 최대 글자 개수 입니다. 이 값보다 적은 글자 수를 이용하여 하나의 문단을 구성합니다.

                            `maxCharsPerParagraph`의 값에 따라 결과 요약 문자의 수가 달라집니다.

                            `maxCharsPerParagraph` 값이 주어질 경우 `outputSizeOption`은 무시됩니다.
                          example: 6000
                      x-tags:
                        - NLP
                    keywordExtraction:
                      type: object
                      description: |-
                        키워드 추출 설정을 위한 객체입니다.

