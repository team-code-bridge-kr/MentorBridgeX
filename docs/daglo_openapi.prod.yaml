                        maxCount:
                          type: integer
                          description: |-
                            추출 할 키워드의 최대 개수 입니다. 

                            값이 클 경우 속도에 영향을 줄 수 있습니다.

                            키워드가 많지 않을 경우 명시된 수 보다 적은 수의 키워드를 추출 할 수 있습니다.
                          minimum: 1
                          example: 10
                        extractAdjectives:
                          type: boolean
                          x-stoplight:
                            id: s6xtt4dnp0ksv
                          description: |-
                            형용사 키워드를 추출여부입니다.

                            true 일 경우 형용사 키워드를 추가로 추출합니다.
                            enable의 값이 true 일 경우에 활성화 됩니다.

                            추출 할 키워드의 수는 maxCount 값에 의해 결정됩니다.
                  x-tags:
                    - NLP
