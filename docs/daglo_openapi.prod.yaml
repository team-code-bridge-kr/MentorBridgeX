                  x-tags:
                    - Common
                  default: false
                custom:
                  type: object
                  description: |-
                    응답에 포함하여 받고 싶은 사용자 객체를 명시합니다.

                    사용자가 요청에 custom 객체를 명시한 경우 동일한 값이 응답에 명시되어 반환됩니다.

                    요청을 자동화 하여 보낼 때 유용합니다.
                  example:
                    app_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                  x-tags:
                    - Common
              required:
                - text
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      summaries:
                        type: array
                        description: |-
