  /nlp/v1/sync/paragraphs:
    x-permission: nlp-sync-paragraph
    post:
      x-descriptors:
        - default: paragraph
      summary: Split text into paragraphs
      description: 주어진 문장들의 내용을 분석하여 내용이 비슷한 문장들 끼리 묶어 문단으로 분리합니다. 전체 문장을 배열 형태로 주면 각 문단의 시작 문장을 인덱스 형태로 반환합니다.
      tags:
        - NLP
        - Sync
      operationId: post-nlp-v1-sync-paragraphs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              x-tags:
                - NLP
              properties:
                sentences:
                  type: array
                  description: 문단으로 분리할 문장들을 텍스트 배열 형태로 명시합니다. 하나의 문장은 하나의 배열 요소가 되어야 합니다. 한국어와 영어를 사용가능합니다.
                  items:
                    type: string
                charsPerParagraph:
                  type: integer
                  description: '한 문단을 구성하는 글자 수에 대한 힌트입니다. 문단을 분리할 때 참고가 되며, 반드시 지켜지는 값은 아닙니다.'
                  example: 2500
                returnElapsedTime:
                  type: boolean
                  description: |
                    계산 소요 시간 반환 여부입니다. `true` 일 경우 response body에 elapsedTime이 추가됩니다.
                  x-tags:
                    - Common
                  default: false
                custom:
                  type: object
                  description: |-
                    응답에 포함하여 받고 싶은 사용자 객체를 명시합니다.

                    사용자가 요청에 custom 객체를 명시한 경우 동일한 값이 응답에 명시되어 반환됩니다.

                    요청을 자동화 하여 보낼 때 유용합니다.
                  example:
                    app_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                  x-tags:
                    - Common
              required:
                - sentences
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                type: object
                x-tags:
                  - NLP
                properties:
                  startIndexes:
                    type: array
                    description: 각 문단의 첫번째 문장의 인덱스로 구성된 배열입니다. 인덱스는 0부터 시작합니다. 분리된 문단의 개수와 배열의 크기는 동일합니다.
                    items:
                      type: integer
                  elapsedTime:
                    type: integer
                    description: 밀리초.
                  custom:
                    type: object
                    description: |-
                      응답에 포함하여 받고 싶은 사용자 객체를 명시합니다.

                      사용자가 요청에 custom 객체를 명시한 경우 동일한 값이 응답에 명시되어 반환됩니다.

