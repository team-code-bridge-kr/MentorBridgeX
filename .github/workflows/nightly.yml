name: Nightly — E2E & 성능 회귀 검사

on:
  schedule:
    # 매일 오전 2시 (UTC) = 한국시간 오전 11시
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "테스트 대상 브랜치"
        required: false
        default: "develop"

env:
  FLUTTER_VERSION: "3.22.x"
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # 1. E2E 테스트 (백엔드 + Flutter 통합)
  # ─────────────────────────────────────────────
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mentorbridgex_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mentorbridgex_e2e
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'develop' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
        working-directory: .

      - name: Run DB migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mentorbridgex_e2e

      - name: Start backend server
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Backend PID: $!"
          sleep 5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: flutter

      - name: Run Flutter integration tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          script: flutter test integration_test/ --dart-define=API_BASE_URL=http://10.0.2.2:8000
          working-directory: flutter
        continue-on-error: true

      - name: Run backend E2E tests
        run: pytest tests/e2e -v --tb=short
        working-directory: backend
        env:
          API_BASE_URL: http://localhost:8000

  # ─────────────────────────────────────────────
  # 2. 성능 회귀 검사 (NFR v0.2 정량 목표 대비)
  # ─────────────────────────────────────────────
  perf-regression:
    name: Performance Regression
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mentorbridgex_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'develop' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt locust

      - name: Run DB migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mentorbridgex_perf

      - name: Start backend server
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run load test (Locust headless)
        run: |
          locust -f backend/tests/perf/locustfile.py \
            --headless \
            --users 50 \
            --spawn-rate 10 \
            --run-time 60s \
            --host http://localhost:8000 \
            --csv=perf-results
        # NOTE: backend/tests/perf/locustfile.py 작성 필요

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.run_id }}
          path: perf-results*.csv
          retention-days: 30

      - name: Assert NFR thresholds
        run: python backend/tests/perf/check_thresholds.py perf-results_stats.csv
        # NOTE: backend/tests/perf/check_thresholds.py 작성 필요 (NFR v0.2 기준)

  # ─────────────────────────────────────────────
  # 3. 의존성 업데이트 알림
  # ─────────────────────────────────────────────
  dependency-check:
    name: Dependency Update Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check outdated Python packages
        run: |
          pip install pip-review
          pip install -r backend/requirements.txt
          pip-review --local 2>&1 | tee outdated-python.txt
        continue-on-error: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Check outdated Flutter packages
        run: |
          flutter pub outdated 2>&1 | tee outdated-flutter.txt
        working-directory: flutter
        continue-on-error: true

      - name: Create dependency update issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 야간 의존성 점검 결과\n\n';

            try {
              body += '### Python\n```\n' + fs.readFileSync('outdated-python.txt', 'utf8') + '\n```\n\n';
            } catch {}
            try {
              body += '### Flutter\n```\n' + fs.readFileSync('outdated-flutter.txt', 'utf8') + '\n```\n';
            } catch {}

            // 기존 열린 의존성 이슈가 있으면 재사용, 없으면 새로 생성
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'type:chore,dependency-update',
              state: 'open',
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[CHORE] 의존성 업데이트 필요 — ' + new Date().toISOString().slice(0,10),
                body,
                labels: ['type:chore', 'dependency-update'],
              });
            }
