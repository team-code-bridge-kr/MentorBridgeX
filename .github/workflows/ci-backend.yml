name: CI — Backend (FastAPI)

on:
  push:
    branches: ["develop", "main", "shared/**", "fix/**", "release/**"]
    paths:
      - "services/api/**"
      - "Makefile"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "services/api/**"
      - "Makefile"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  OFFLINE_DEMO: "1"
  DAGLO_API_TOKEN: test-token

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: ruff (lint)
        run: ruff check .

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
