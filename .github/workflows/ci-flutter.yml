name: CI — Flutter (Android / iOS / Windows)

on:
  push:
    branches: ["develop", "main", "shared/**", "fix/**", "release/**"]
    paths:
      - "flutter/**"
      - ".github/workflows/ci-flutter.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "flutter/**"
      - ".github/workflows/ci-flutter.yml"

concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.22.x"

jobs:
  # ─────────────────────────────────────────────
  # 1. 린트 & 분석
  # ─────────────────────────────────────────────
  analyze:
    name: Dart Analyze & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Dart format check
        run: dart format --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

  # ─────────────────────────────────────────────
  # 2. 단위 / 위젯 테스트
  # ─────────────────────────────────────────────
  unit-test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: flutter/coverage/lcov.info
          flags: flutter-unit
        if: always()

  # ─────────────────────────────────────────────
  # 3. Android 빌드
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. iOS 빌드 (시뮬레이터)
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS (Simulator)
    runs-on: macos-latest
    needs: unit-test
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --simulator --no-codesign

  # ─────────────────────────────────────────────
  # 5. Windows 빌드
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: unit-test
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --debug

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-build
          path: flutter/build/windows/x64/runner/Debug/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 6. 접근성 자동 검증 (axe — 인계 문서 §2.8)
  # ─────────────────────────────────────────────
  accessibility:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run accessibility (semantics) tests
        run: flutter test test/accessibility/ --reporter expanded
        # NOTE: test/accessibility/ 디렉토리에 SemanticsChecker 기반 테스트 작성 필요
        # 해당 테스트 없을 경우 이 step은 skip 처리됨
        continue-on-error: true
