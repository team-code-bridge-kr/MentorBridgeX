<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>DFD Level 1 백엔드 내부 프로세스 다이어그램</title>
  <desc>6개 주요 프로세스(생기부 입력, 그래프 관리, 동기화, 양식 변환, 음성 활동 기록, 사용자/권한 관리)와 데이터 저장소 간 흐름</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14px; fill: #2C2C2A; }
      .ts { font-size: 12px; fill: #5F5E5A; }
      .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .arr { stroke: #5F5E5A; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- 시스템 경계 (점선) -->
  <rect x="200" y="90" width="220" height="580" rx="16" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="ts" x="210" y="84" text-anchor="start">백엔드 시스템 경계</text>

  <!-- 외부 엔티티: 사용자 (좌상단) -->
  <rect x="30" y="30" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="100" y="52" text-anchor="middle" dominant-baseline="central" fill="#0C447C">사용자</text>

  <!-- 외부 엔티티: 모바일 앱 (우상단) -->
  <rect x="510" y="30" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="580" y="52" text-anchor="middle" dominant-baseline="central" fill="#0C447C">모바일 앱</text>

  <!-- 외부 엔티티: ML 서비스 (우중단) -->
  <rect x="510" y="350" width="140" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="580" y="372" text-anchor="middle" dominant-baseline="central" fill="#712B13">ML 서비스</text>

  <!-- 외부 엔티티: STT 엔진 (우하단) -->
  <rect x="510" y="490" width="140" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="580" y="512" text-anchor="middle" dominant-baseline="central" fill="#712B13">STT 엔진</text>

  <!-- 외부 엔티티: OAuth (좌하단) -->
  <rect x="30" y="690" width="140" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="100" y="712" text-anchor="middle" dominant-baseline="central" fill="#085041">OAuth Provider</text>

  <!-- P1. 생기부 입력 처리 -->
  <rect x="220" y="100" width="180" height="56" rx="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="310" y="122" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P1. 생기부 입력</text>
  <text class="ts" x="310" y="140" text-anchor="middle" dominant-baseline="central" fill="#534AB7">시드/PDF 처리</text>

  <!-- P2. 그래프 관리 -->
  <rect x="220" y="200" width="180" height="56" rx="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="310" y="222" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P2. 그래프 관리</text>
  <text class="ts" x="310" y="240" text-anchor="middle" dominant-baseline="central" fill="#534AB7">노드/엣지 CRUD</text>

  <!-- P3. 동기화 -->
  <rect x="220" y="300" width="180" height="56" rx="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="310" y="322" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P3. 동기화</text>
  <text class="ts" x="310" y="340" text-anchor="middle" dominant-baseline="central" fill="#534AB7">그래프 ↔ 텍스트</text>

  <!-- P4. 양식 변환 -->
  <rect x="220" y="400" width="180" height="56" rx="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="310" y="422" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P4. 양식 변환</text>
  <text class="ts" x="310" y="440" text-anchor="middle" dominant-baseline="central" fill="#534AB7">템플릿 기반 생성</text>

  <!-- P5. 음성 활동 기록 -->
  <rect x="220" y="500" width="180" height="56" rx="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="310" y="522" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P5. 음성 활동 기록</text>
  <text class="ts" x="310" y="540" text-anchor="middle" dominant-baseline="central" fill="#534AB7">STT/RAG 처리</text>

  <!-- P6. 사용자/권한 관리 -->
  <rect x="220" y="600" width="180" height="56" rx="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="310" y="622" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P6. 사용자/권한</text>
  <text class="ts" x="310" y="640" text-anchor="middle" dominant-baseline="central" fill="#534AB7">인증·역할 관리</text>

  <!-- 데이터 저장소 (amber, 우측) -->
  <rect x="450" y="110" width="180" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="540" y="128" text-anchor="middle" dominant-baseline="central" fill="#633806">D1. 생기부 텍스트 DB</text>

  <rect x="450" y="210" width="180" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="540" y="228" text-anchor="middle" dominant-baseline="central" fill="#633806">D2. 그래프 DB</text>

  <rect x="450" y="260" width="180" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="540" y="278" text-anchor="middle" dominant-baseline="central" fill="#633806">D3. 벡터 스토어 (RAG)</text>

  <rect x="450" y="410" width="180" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="540" y="428" text-anchor="middle" dominant-baseline="central" fill="#633806">D4. 양식·템플릿 DB</text>

  <rect x="450" y="560" width="180" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="540" y="578" text-anchor="middle" dominant-baseline="central" fill="#633806">D5. 음성/보고서 저장소</text>

  <rect x="30" y="610" width="140" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="100" y="628" text-anchor="middle" dominant-baseline="central" fill="#633806">D6. 사용자 DB</text>

  <rect x="30" y="660" width="140" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="100" y="678" text-anchor="middle" dominant-baseline="central" fill="#633806">D7. 감사 로그</text>

  <!-- 사용자 → P1, P2, P3, P4, P6 (좌측 공용 라인) -->
  <line x1="100" y1="74" x2="100" y2="630" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3" fill="none"/>
  <line x1="100" y1="128" x2="220" y2="128" class="arr" marker-end="url(#arrow)"/>
  <line x1="100" y1="228" x2="220" y2="228" class="arr" marker-end="url(#arrow)"/>
  <line x1="100" y1="328" x2="220" y2="328" class="arr" marker-end="url(#arrow)"/>
  <line x1="100" y1="428" x2="220" y2="428" class="arr" marker-end="url(#arrow)"/>
  <line x1="100" y1="628" x2="220" y2="628" class="arr" marker-end="url(#arrow)"/>

  <!-- 모바일 앱 → P5 -->
  <line x1="580" y1="74" x2="580" y2="90" stroke="#888780" stroke-width="0.5" fill="none"/>
  <path d="M580 90 L580 528 L400 528" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="595" y="300" text-anchor="start">음성 스트림</text>

  <!-- P1 → D1 -->
  <line x1="400" y1="128" x2="450" y2="128" class="arr" marker-end="url(#arrow)"/>

  <!-- P1 → P2 -->
  <line x1="310" y1="156" x2="310" y2="200" class="arr" marker-end="url(#arrow)"/>

  <!-- P2 ↔ D2 -->
  <line x1="400" y1="222" x2="450" y2="222" class="arr" marker-end="url(#arrow)"/>
  <line x1="450" y1="234" x2="400" y2="234" class="arr" marker-end="url(#arrow)"/>

  <!-- P2 → P3 -->
  <line x1="310" y1="256" x2="310" y2="300" class="arr" marker-end="url(#arrow)"/>

  <!-- P3 ↔ D1 -->
  <path d="M400 314 L430 314 L430 138 L450 138" class="arr" marker-end="url(#arrow)"/>

  <!-- P3 ↔ D2 -->
  <path d="M400 322 L420 322 L420 240 L450 240" class="arr" marker-end="url(#arrow)"/>

  <!-- P4 ↔ D2 -->
  <path d="M400 414 L430 414 L430 240 L450 240" class="arr" marker-end="url(#arrow)"/>

  <!-- P4 ↔ D4 -->
  <line x1="400" y1="428" x2="450" y2="428" class="arr" marker-end="url(#arrow)"/>

  <!-- P5 → D5 -->
  <line x1="400" y1="540" x2="450" y2="578" class="arr" marker-end="url(#arrow)"/>

  <!-- P5 ↔ D2 -->
  <path d="M400 514 L420 514 L420 234 L450 234" class="arr" marker-end="url(#arrow)"/>

  <!-- P5 ↔ STT 엔진 -->
  <line x1="400" y1="520" x2="510" y2="512" class="arr" marker-end="url(#arrow)"/>
  <line x1="510" y1="524" x2="400" y2="540" class="arr" marker-end="url(#arrow)"/>

  <!-- P3, P4 ↔ ML 서비스 -->
  <line x1="425" y1="372" x2="510" y2="372" stroke="#888780" stroke-width="0.5" fill="none"/>
  <path d="M400 340 L425 340 L425 372" class="arr" marker-end="url(#arrow)"/>
  <path d="M400 446 L425 446 L425 372" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="438" y="392" text-anchor="start">추론 요청/응답</text>

  <!-- P6 ↔ D6 -->
  <line x1="220" y1="622" x2="170" y2="622" class="arr" marker-end="url(#arrow)"/>
  <line x1="170" y1="634" x2="220" y2="634" class="arr" marker-end="url(#arrow)"/>

  <!-- P6 → D7 -->
  <line x1="220" y1="648" x2="170" y2="675" class="arr" marker-end="url(#arrow)"/>

  <!-- P6 → OAuth -->
  <line x1="220" y1="640" x2="170" y2="700" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="190" y="685" text-anchor="middle">인증</text>
</svg>
