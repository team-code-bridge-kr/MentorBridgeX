# WebSocket 업그레이드용 Connection 헤더 매핑 (STT 실시간 /v1/stt)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 오디오 업로드(STT) 여유
    client_max_body_size 64m;

    # API 프록시 — 프론트는 same-origin 으로 /v1/** 을 호출한다.
    # ^~ 로 아래 정적파일 정규식 location 보다 우선하게 한다.
    location ^~ /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (STT 실시간)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # LLM/STT 응답이 길어질 수 있어 타임아웃을 늘린다
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # .mjs 는 기본 mime.types 에 없어서 application/octet-stream 으로 나가고,
    # 그러면 브라우저가 모듈 스크립트로 받지 않는다 (pdf.js 워커가 여기서 막혔다).
    # server 수준 types 블록은 상속받은 mime.types 를 통째로 덮어써서 HTML 까지
    # 깨뜨리므로, 이 확장자에만 default_type 을 준다.
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
