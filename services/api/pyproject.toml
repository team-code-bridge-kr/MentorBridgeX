[project]
name = "mentorbridgex-api"
version = "0.1.0"
description = "MentorBridgeX ontology API (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "neo4j>=5.26.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "ulid-py>=1.1.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "pymupdf>=1.24.0",
    "grpcio>=1.66.0",
    "protobuf>=5.28.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
# EMBEDDING_ADAPTER=real 에만 필요. torch 를 끌어와 무거우므로 기본 의존성에서 분리.
# CPU 전용 설치: pip install torch --index-url https://download.pytorch.org/whl/cpu
embeddings = [
    "sentence-transformers>=3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "app/core/daglo/proto/speech_pb2.py",
    "app/core/daglo/proto/speech_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["N802", "N815"]
