<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorBridgeX Graph Viewer (Dev)</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #fafaf9;
      --border: #e7e5e4;
      --muted: #57534e;
    }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      background: var(--bg);
    }
    main {
      display: grid;
      grid-template-columns: 1fr 260px;
      min-height: 0;
      height: 100%;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    input, button, select {
      padding: 8px 10px;
      font-size: 14px;
    }
    #network {
      width: 100%;
      height: 100%;
      min-height: 560px;
      background: #f6f6f6;
    }
    aside {
      border-left: 1px solid var(--border);
      background: #fff;
      overflow: auto;
      padding: 8px;
    }
    .side-title {
      font-size: 12px;
      color: var(--muted);
      margin: 4px 0 8px;
    }
    .node-list-item {
      width: 100%;
      text-align: left;
      font-size: 12px;
      padding: 6px 8px;
      border: 1px solid #e7e5e4;
      border-radius: 6px;
      background: #fff;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .node-list-item:hover { background: #fafaf9; }
    .meta { color: var(--muted); font-size: 13px; }
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .legend .kw::before { background: #f97316; }
    .legend .doc::before { background: #3b82f6; }
    .legend .inq::before { background: #8b5cf6; }
    .legend .other::before { background: #64748b; }
  </style>
</head>
<body>
  <header>
    <strong>Graph Viewer</strong>
    <input id="token" placeholder="Bearer access_token" style="min-width: 280px" />
    <label class="meta">
      키워드 상한
      <input id="maxKeywords" type="number" min="50" step="50" value="300" style="width: 90px" />
    </label>
    <button id="load" type="button">그래프 불러오기</button>
    <button id="resetView" type="button">뷰 리셋</button>
    <label class="meta">
      <input id="physics" type="checkbox" /> 물리 시뮬레이션
    </label>
    <span class="meta" id="status"></span>
    <div class="legend" aria-label="범례">
      <span class="kw">Keyword (PDF 빈도)</span>
      <span class="doc">Document</span>
      <span class="inq">Inquiry</span>
      <span class="other">기타</span>
    </div>
  </header>
  <main>
    <div id="network"></div>
    <aside>
      <div class="side-title">노드 목록(상위 80)</div>
      <div id="nodeList"></div>
    </aside>
  </main>
  <script>
    const TYPE_STYLE = {
      Keyword: { color: { background: '#fed7aa', border: '#f97316' }, shape: 'dot' },
      Document: { color: { background: '#bfdbfe', border: '#3b82f6' }, shape: 'box' },
      Inquiry: { color: { background: '#ddd6fe', border: '#8b5cf6' }, shape: 'diamond' },
      Activity: { color: { background: '#bbf7d0', border: '#22c55e' }, shape: 'ellipse' },
      Subject: { color: { background: '#fecaca', border: '#ef4444' }, shape: 'ellipse' },
      Period: { color: { background: '#e2e8f0', border: '#64748b' }, shape: 'ellipse' },
    };

    function nodeSize(node) {
      const refs = node.external_refs || {};
      const freq = refs.frequency;
      if (node.type === 'Keyword' && typeof freq === 'number') {
        return Math.min(18 + Math.log2(freq + 1) * 6, 42);
      }
      return node.type === 'Document' ? 24 : 14;
    }

    function nodeTitle(node) {
      const lines = [node.type, node.label];
      if (node.description) lines.push(node.description);
      const refs = node.external_refs || {};
      if (refs.frequency != null) lines.push(`빈도: ${refs.frequency}`);
      if (refs.weight != null) lines.push(`가중치(ML): ${refs.weight}`);
      else if (refs.source === 'pdf_tokens') lines.push('가중치: 팀장 ML 연동 예정');
      return lines.join('\n');
    }

    const statusEl = document.getElementById('status');
    const tokenInput = document.getElementById('token');
    const nodeListEl = document.getElementById('nodeList');
    const saved = localStorage.getItem('mbx_token');
    if (saved) tokenInput.value = saved;

    let network = null;

    function normalizeToken(raw) {
      const t = raw.trim();
      return t.toLowerCase().startsWith('bearer ') ? t.slice(7).trim() : t;
    }

    function keywordFreq(node) {
      const refs = node.external_refs || {};
      const freq = Number(refs.frequency);
      return Number.isFinite(freq) ? freq : 0;
    }

    function filterGraph(data, maxKeywords) {
      const keywords = data.nodes.filter(n => n.type === 'Keyword');
      const fixed = data.nodes.filter(n => n.type !== 'Keyword');

      keywords.sort((a, b) => keywordFreq(b) - keywordFreq(a));
      const pickedKeywords = keywords.slice(0, maxKeywords);
      const keep = new Set([...fixed, ...pickedKeywords].map(n => n.id));

      const nodes = data.nodes.filter(n => keep.has(n.id));
      const edges = data.edges.filter(e => keep.has(e.source_id) && keep.has(e.target_id));
      return { nodes, edges, pickedKeywordCount: pickedKeywords.length, totalKeywordCount: keywords.length };
    }

    function withSeedPositions(nodes) {
      const docs = nodes.filter(n => n.type === 'Document');
      const keywords = nodes.filter(n => n.type === 'Keyword');
      const others = nodes.filter(n => n.type !== 'Document' && n.type !== 'Keyword');

      const seeded = [];
      const centerGap = 180;
      docs.forEach((n, i) => {
        seeded.push({ ...n, x: i * centerGap, y: 0 });
      });

      const ringRadius = Math.max(320, keywords.length * 1.6);
      keywords.forEach((n, i) => {
        const angle = (2 * Math.PI * i) / Math.max(1, keywords.length);
        seeded.push({
          ...n,
          x: Math.round(Math.cos(angle) * ringRadius),
          y: Math.round(Math.sin(angle) * ringRadius),
        });
      });

      const outerRadius = ringRadius + 260;
      others.forEach((n, i) => {
        const angle = (2 * Math.PI * i) / Math.max(1, others.length);
        seeded.push({
          ...n,
          x: Math.round(Math.cos(angle) * outerRadius),
          y: Math.round(Math.sin(angle) * outerRadius),
        });
      });
      return seeded;
    }

    document.getElementById('load').onclick = async () => {
      const token = normalizeToken(tokenInput.value);
      if (!token) {
        statusEl.textContent = '토큰을 입력하세요 (/v1/auth/dev-login)';
        return;
      }
      localStorage.setItem('mbx_token', tokenInput.value.trim());
      statusEl.textContent = '로딩 중…';

      const res = await fetch('/v1/students/me/graph', {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) {
        statusEl.textContent = `오류 ${res.status}`;
        return;
      }
      const data = await res.json();
      const maxKeywords = Number(document.getElementById('maxKeywords').value || 300);
      const filtered = filterGraph(data, maxKeywords);
      const seededNodes = withSeedPositions(filtered.nodes);

      const nodes = new vis.DataSet(seededNodes.map(n => {
        const style = TYPE_STYLE[n.type] || TYPE_STYLE.Keyword;
        return {
          id: n.id,
          label: n.label,
          title: nodeTitle(n),
          size: Math.max(18, nodeSize(n)),
          font: { face: 'Apple SD Gothic Neo, sans-serif' },
          borderWidth: 2,
          ...style,
          x: n.x,
          y: n.y,
        };
      }));
      const edges = new vis.DataSet(filtered.edges.map(e => ({
        id: e.id,
        from: e.source_id,
        to: e.target_id,
        label: e.relation,
        arrows: 'to',
        font: { align: 'middle', size: 10 },
        color: { color: '#a8a29e' },
      })));

      const physicsOn = document.getElementById('physics').checked;
      const options = {
        physics: physicsOn
          ? {
              stabilization: { enabled: true, iterations: 80, fit: true },
              solver: 'forceAtlas2Based',
              forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.01 },
            }
          : false,
        layout: { improvedLayout: true, randomSeed: 42 },
        interaction: { hover: true, tooltipDelay: 80 },
        nodes: { shapeProperties: { borderDashes: false } },
        edges: { smooth: { type: 'dynamic' } },
      };

      if (network) network.destroy();
      network = new vis.Network(document.getElementById('network'), { nodes, edges }, options);
      network.setSize('100%', '100%');
      network.redraw();
      network.once('stabilized', () => {
        network.fit({ animation: { duration: 300 } });
        network.moveTo({ position: { x: 0, y: 0 }, scale: 0.8, animation: false });
      });
      setTimeout(() => {
        network.redraw();
        network.fit({ animation: false });
        network.moveTo({ position: { x: 0, y: 0 }, scale: 0.8, animation: false });
      }, 250);
      setTimeout(() => {
        network.redraw();
        network.fit({ animation: false });
      }, 700);
      statusEl.textContent =
        `표시 노드 ${filtered.nodes.length}/${data.nodes.length} · ` +
        `표시 엣지 ${filtered.edges.length}/${data.edges.length} · ` +
        `키워드 ${filtered.pickedKeywordCount}/${filtered.totalKeywordCount}`;

      const byFreq = [...filtered.nodes].sort((a, b) => keywordFreq(b) - keywordFreq(a)).slice(0, 80);
      nodeListEl.innerHTML = '';
      byFreq.forEach(n => {
        const btn = document.createElement('button');
        btn.className = 'node-list-item';
        const freq = keywordFreq(n);
        btn.textContent = `[${n.type}] ${n.label}${freq ? ` (${freq})` : ''}`;
        btn.onclick = () => {
          if (!network) return;
          network.selectNodes([n.id]);
          network.focus(n.id, { scale: 1.1, animation: { duration: 250 } });
        };
        nodeListEl.appendChild(btn);
      });
    };

    document.getElementById('resetView').onclick = () => {
      if (!network) return;
      network.fit({ animation: { duration: 200 } });
      network.moveTo({ position: { x: 0, y: 0 }, scale: 0.8, animation: false });
    };
  </script>
</body>
</html>
