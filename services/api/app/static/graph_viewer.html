<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorBridgeX Graph Viewer (Dev)</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { padding: 12px 16px; border-bottom: 1px solid #e7e5e4; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, button { padding: 8px 10px; font-size: 14px; }
    #network { width: 100%; height: 100%; background: #fafaf9; }
    .meta { color: #57534e; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <strong>Graph Viewer</strong>
    <input id="token" placeholder="Bearer access_token" style="min-width: 280px" />
    <button id="load">그래프 불러오기</button>
    <span class="meta" id="status"></span>
  </header>
  <div id="network"></div>
  <script>
    const statusEl = document.getElementById('status');
    const tokenInput = document.getElementById('token');
    const saved = localStorage.getItem('mbx_token');
    if (saved) tokenInput.value = saved;

    document.getElementById('load').onclick = async () => {
      const token = tokenInput.value.trim();
      if (!token) { statusEl.textContent = '토큰을 입력하세요 (/v1/auth/dev-login)'; return; }
      localStorage.setItem('mbx_token', token);
      statusEl.textContent = '로딩 중...';
      const res = await fetch('/v1/students/me/graph', {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) {
        statusEl.textContent = `오류 ${res.status}`;
        return;
      }
      const data = await res.json();
      const nodes = new vis.DataSet(data.nodes.map(n => ({
        id: n.id,
        label: n.label,
        title: `${n.type}\n${n.description || ''}`
      })));
      const edges = new vis.DataSet(data.edges.map(e => ({
        id: e.id,
        from: e.source_id,
        to: e.target_id,
        label: e.relation,
        arrows: 'to'
      })));
      new vis.Network(document.getElementById('network'), { nodes, edges }, {
        physics: { stabilization: true },
        edges: { font: { align: 'middle' } }
      });
      statusEl.textContent = `노드 ${data.nodes.length} · 엣지 ${data.edges.length}`;
    };
  </script>
</body>
</html>
